[tool.ruff]
line-length = 88
target-version = "py38"
extend-exclude = ["API.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.pyright]
reportMissingImports = false
pythonVersion = "3.6"
